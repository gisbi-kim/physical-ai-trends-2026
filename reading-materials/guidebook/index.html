<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Physical AI 심화 리딩 가이드 171쪽 웹 뷰어">
  <title>Physical AI 심화 리딩 가이드</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #102c46;
      --paper: #f7f4ed;
      --line: #d8dee5;
      --accent: #d9654b;
      --link: #087f8c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family:
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        system-ui,
        sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 64px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    h1 {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    nav {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    a {
      color: var(--link);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      white-space: nowrap;
    }

    .button.primary {
      color: #ffffff;
      border-color: var(--accent);
      background: var(--accent);
    }

    main {
      min-height: 0;
      padding: 10px;
    }

    object {
      display: block;
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .fallback {
      max-width: 680px;
      margin: 12vh auto 0;
      padding: 28px;
      text-align: center;
    }

    @media (max-width: 720px) {
      header {
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 12px;
      }

      h1 {
        flex-basis: 100%;
        order: -1;
      }

      nav {
        width: 100%;
        overflow-x: auto;
      }

      main {
        padding: 0;
      }

      object {
        border: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Physical AI 심화 리딩 가이드 · 9개 장 180편</h1>
    <nav aria-label="리딩 가이드 이동">
      <a class="button" href="../../">원책 읽기</a>
      <a
        class="button"
        href="https://github.com/gisbi-kim/physical-ai-trends-2026/blob/main/reading-materials/paper-catalog/README.md"
      >180편 카탈로그</a>
      <a class="button primary" href="./physical-ai-deep-reading-guide.pdf">PDF 열기</a>
    </nav>
  </header>
  <main>
    <object
      data="./physical-ai-deep-reading-guide.pdf#view=FitH"
      type="application/pdf"
      aria-label="Physical AI 심화 리딩 가이드 PDF"
    >
      <div class="fallback">
        <p>이 브라우저에서는 내장 PDF 뷰어를 사용할 수 없습니다.</p>
        <p>
          <a class="button primary" href="./physical-ai-deep-reading-guide.pdf">
            PDF를 새 화면에서 여세요.
          </a>
        </p>
      </div>
    </object>
  </main>
</body>
</html>
